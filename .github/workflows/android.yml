
name: Build APKs (Test)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the page
        run: python3 src/build.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build test APKs
        env:
          URTV_BRANCH: ${{ github.ref_name }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk urtv-screensaver-test.apk
          cp android/launcher/build/outputs/apk/release/launcher-release.apk urtv-home-test.apk

      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: urtv-test-apks
          path: |
            urtv-screensaver-test.apk
            urtv-home-test.apk
          retention-days: 7
